name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Throwaway database: applies every migration from scratch, plus seed.sql
      - name: Start local Supabase
        run: npx supabase start

      - name: Database tests (pgTAP)
        run: npx supabase test db

      - name: Point the app at the local Supabase
        run: |
          npx supabase status -o env > supabase.env
          URL=$(grep '^API_URL=' supabase.env | cut -d= -f2- | tr -d '"')
          KEY=$(grep '^ANON_KEY=' supabase.env | cut -d= -f2- | tr -d '"')
          test -n "$URL" && test -n "$KEY"
          echo "VITE_SUPABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test
        env:
          E2E_EMAIL: e2e@sigil.test
          E2E_PASSWORD: sigil-local-e2e   # local throwaway user from seed.sql, not a secret
          E2E_ALLOW_WRITES: 'true'

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup